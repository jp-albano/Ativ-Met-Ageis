name: Java Build and Tests

on:
  push:
    branches:
      - main
      - "fix/**"
      - "test/**"
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pom.xml'
      - '.github/workflows/java-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pom.xml'
      - '.github/workflows/java-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compile and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compile and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify
